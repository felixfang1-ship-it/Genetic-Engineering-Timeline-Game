<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genetic Engineering Timeline Game</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d9e2ec;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --line: #374151;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtle {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .word-bank {
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      margin-bottom: 24px;
    }

    .word-bank h2 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 1.4rem;
    }

    .bank-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 72px;
    }

    .event-card {
      background: var(--blue-soft);
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.95rem;
      line-height: 1.35;
      max-width: 240px;
      user-select: none;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .event-card:hover {
      transform: translateY(-1px);
    }

    .event-card.selected {
      border-color: var(--blue);
      background: #dbeafe;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .timeline-wrap {
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .timeline-grid {
      min-width: 1280px;
      display: grid;
      grid-template-columns: repeat(16, minmax(72px, 1fr));
      gap: 10px;
      align-items: start;
    }

    .slot-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dropzone {
      width: 100%;
      min-height: 92px;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      margin-bottom: 12px;
      transition: border-color 0.12s ease, background 0.12s ease;
      overflow: hidden;
    }

    .dropzone.empty::before {
      content: "Insert Here";
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .dropzone.active {
      border-color: var(--blue);
      background: #eff6ff;
    }

    .dropzone.correct {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .dropzone.wrong {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .dropzone .event-card {
      max-width: none;
      width: 100%;
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stem {
      width: 4px;
      height: 22px;
      background: var(--line);
      border-radius: 999px;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--line);
      margin-top: -2px;
    }

    .year {
      margin-top: 8px;
      font-weight: 700;
      font-size: 0.98rem;
      text-align: center;
      white-space: nowrap;
    }

    .hline {
      grid-column: 1 / -1;
      height: 5px;
      background: var(--line);
      border-radius: 999px;
      margin-top: -6px;
      margin-bottom: 9px;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn {
      background: var(--blue);
      color: white;
    }

    .reset-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .feedback {
      margin-top: 14px;
      min-height: 28px;
      font-weight: 700;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .app { padding: 14px; }
      .event-card { max-width: 100%; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>History of Genetic Engineering Timeline Game</h1>
    <div class="subtle">
      Tap an event in the word bank, then tap a year box to place it.
      Tap a placed event to send it back to the word bank.
      Press <b>Submit</b> to check your order. Wrong events return to the bank.
    </div>

    <div class="topbar">
      <div class="pill" id="progressText">Correctly placed: 0 / 16</div>
      <div class="pill" id="selectedText">Selected: none</div>
    </div>

    <div class="word-bank">
      <h2>Word Bank</h2>
      <div class="bank-items" id="bank"></div>
    </div>

    <div class="timeline-wrap">
      <div class="timeline-grid" id="timeline"></div>
    </div>

    <div class="actions">
      <button class="submit-btn" id="submitBtn">Submit</button>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    const timelineData = [
      { year: "1868", id: "1868", event: "Friedrich Miescher isolates DNA" },
      { year: "1953", id: "1953", event: "Watson and Crick elucidate the double helix structure of DNA" },
      { year: "1962", id: "1962", event: "Arber provides evidence for restriction enzymes" },
      { year: "1966", id: "1966", event: "Nirenberg and Khorana finish unraveling the genetic code" },
      { year: "1967", id: "1967", event: "Gellert discovers DNA ligase enzyme" },
      { year: "1972-73", id: "1972-73", event: "Berg, Boyer and Cohen develop the first recombinant DNA molecule" },
      { year: "1975-77", id: "1975-77", event: "Development of DNA sequencing" },
      { year: "1980-82", id: "1980-82", event: "First transgenic animals produced" },
      { year: "1984", id: "1984", event: "Sheep-goat chimera created" },
      { year: "1985", id: "1985", event: "First transgenic farm animals produced" },
      { year: "1990", id: "1990", event: "Launching of the Human Genome Project" },
      { year: "1991", id: "1991", event: "First gene therapy trial in humans" },
      { year: "1997", id: "1997", event: "Birth of Dolly, a cloned sheep" },
      { year: "2000", id: "2000", event: "Completion of the first draft of the human genome" },
      { year: "2003", id: "2003", event: "Human genome completed" },
      { year: "2013", id: "2013", event: "Jolie undergoes preventive double mastectomy after learning she carries a mutation of the BRCA1 gene" }
    ];

    const bank = document.getElementById("bank");
    const timeline = document.getElementById("timeline");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const feedback = document.getElementById("feedback");
    const progressText = document.getElementById("progressText");
    const selectedText = document.getElementById("selectedText");

    let selectedCard = null;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function setSelected(card) {
      document.querySelectorAll(".event-card").forEach(c => c.classList.remove("selected"));
      document.querySelectorAll(".dropzone").forEach(z => z.classList.remove("active"));

      selectedCard = card;

      if (selectedCard) {
        selectedCard.classList.add("selected");
        selectedText.textContent = `Selected: ${selectedCard.textContent}`;
        document.querySelectorAll(".dropzone").forEach(z => z.classList.add("active"));
      } else {
        selectedText.textContent = "Selected: none";
      }
    }

    function makeCard(item) {
      const card = document.createElement("div");
      card.className = "event-card";
      card.dataset.id = item.id;
      card.textContent = item.event;

      card.addEventListener("click", () => {
        if (card.parentElement && card.parentElement.classList.contains("dropzone")) {
          bank.appendChild(card);
          setSelected(null);
          refreshEmptyStates();
          clearFeedback();
          updateProgress();
          return;
        }

        if (selectedCard === card) {
          setSelected(null);
        } else {
          setSelected(card);
        }
      });

      return card;
    }

    function makeSlot(item) {
      const col = document.createElement("div");
      col.className = "slot-col";

      const dropzone = document.createElement("div");
      dropzone.className = "dropzone empty";
      dropzone.dataset.id = item.id;

      dropzone.addEventListener("click", () => {
        if (!selectedCard) return;

        if (dropzone.firstChild) {
          bank.appendChild(dropzone.firstChild);
        }

        dropzone.appendChild(selectedCard);
        setSelected(null);
        refreshEmptyStates();
        clearFeedback();
        updateProgress();
      });

      const stem = document.createElement("div");
      stem.className = "stem";

      const dot = document.createElement("div");
      dot.className = "dot";

      const year = document.createElement("div");
      year.className = "year";
      year.textContent = item.year;

      col.appendChild(dropzone);
      col.appendChild(stem);
      col.appendChild(dot);
      col.appendChild(year);

      return col;
    }

    function refreshEmptyStates() {
      document.querySelectorAll(".dropzone").forEach(zone => {
        zone.classList.toggle("empty", !zone.firstChild);
      });
    }

    function clearFeedback() {
      document.querySelectorAll(".dropzone").forEach(zone => {
        zone.classList.remove("correct", "wrong");
      });
      feedback.textContent = "";
      feedback.className = "feedback";
    }

    function updateProgress() {
      let correct = 0;
      document.querySelectorAll(".dropzone").forEach(zone => {
        const card = zone.firstChild;
        if (card && card.dataset.id === zone.dataset.id) {
          correct += 1;
        }
      });
      progressText.textContent = `Correctly placed: ${correct} / ${timelineData.length}`;
    }

    function setupGame() {
      bank.innerHTML = "";
      timeline.innerHTML = "";
      feedback.textContent = "";
      feedback.className = "feedback";
      selectedCard = null;
      selectedText.textContent = "Selected: none";

      const shuffled = shuffle(timelineData);
      shuffled.forEach(item => bank.appendChild(makeCard(item)));
      timelineData.forEach(item => timeline.appendChild(makeSlot(item)));

      const line = document.createElement("div");
      line.className = "hline";
      timeline.appendChild(line);

      refreshEmptyStates();
      updateProgress();
    }

    submitBtn.addEventListener("click", () => {
      let allCorrect = true;
      let returned = 0;

      document.querySelectorAll(".dropzone").forEach(zone => {
        zone.classList.remove("correct", "wrong");
        const card = zone.firstChild;

        if (!card) {
          allCorrect = false;
          return;
        }

        if (card.dataset.id === zone.dataset.id) {
          zone.classList.add("correct");
        } else {
          zone.classList.add("wrong");
          bank.appendChild(card);
          returned += 1;
          allCorrect = false;
        }
      });

      setSelected(null);
      refreshEmptyStates();
      updateProgress();

      if (allCorrect) {
        feedback.textContent = "Perfect — every event is in the correct order.";
        feedback.className = "feedback good";
      } else {
        feedback.textContent = `${returned} event(s) were incorrect and returned to the word bank.`;
        feedback.className = "feedback bad";
      }
    });

    resetBtn.addEventListener("click", setupGame);

    setupGame();
  </script>
</body>
</html>
